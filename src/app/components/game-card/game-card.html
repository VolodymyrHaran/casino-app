<div class="game-card">
    <img [src]="game.image" [alt]="game.name">

    <h3>{{ game.name }}</h3>

    <p>{{ game.provider }}</p>

    <p>Rating: {{ game.rating }}</p>

    @if (game.isFavorite) {
      <p>⭐ Favorite</p>
    }

    <button (click)="toggleFavorite()">
    @if (!game.isFavorite) {
      Add to Favorites
    }
    @else {
      Remove from Favorites
    }
    </button>

    <a [routerLink]="['/games', game.id]">
      View Details
    </a>
</div>
