<h2>Games</h2>

<div class="games-grid">
  @for (game of games; track game.name) {
    <div class="game-card">
      <img [src]="game.image" [alt]="game.name">

      <h3>{{ game.name }}</h3>

      <p>{{ game.provider }}</p>

      <p>Rating: {{ game.rating }}</p>

      @if (game.isFavorite) {
        <p>⭐ Favorite</p>
      }

      <button (click)="toggleFavorite(game)">
      @if (!game.isFavorite) {
        Toggle Favorite
      }
      @else {
        Remove Favorite
      }
      </button>

      <button>Play</button>
    </div>
  }
  

</div>
