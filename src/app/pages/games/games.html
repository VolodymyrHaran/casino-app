<h2>Games</h2>

<div class="games-grid">

  <div class="game-card" *ngFor="let game of games">

    <img [src]="game.image" [alt]="game.name">

    <h3>{{ game.name }}</h3>

    <p>{{ game.provider }}</p>

    <p>Rating: {{ game.rating }}</p>

    <p *ngIf="game.isFavorite" >⭐ Favorite</p>


    <button (click)="toggleFavorite(game)">Toggle Favorite</button>
    <button>Play</button>
  </div>

</div>
